# 통합 테스트 전용 설정. 실제 비밀값을 넣지 않는다(아래 값은 테스트용 가짜 값).
#
# 테스트는 PostGIS 가 켜진 "전용" DB 가 필요하다. 이 DB 는 매 실행마다 Flyway clean 후 다시 마이그레이션되므로
# 개발 DB 와 반드시 달라야 하고 DB 이름이 _test 로 끝나야 한다(TestFlywayConfig 가 확인한다).
#   docker compose up -d   (docker/initdb 가 <DB_NAME>_test 를 만든다)
#   환경변수 TEST_DB_URL / TEST_DB_USERNAME / TEST_DB_PASSWORD 를 설정하거나 .env 에 적는다.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/flatmapv2_test}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}

spring.flyway.clean-disabled=false

# 서로 다른 Spring 컨텍스트가 캐시되어 남는 동안 컨텍스트마다 연결 풀이 열려 있다. 기본 풀 크기(10)로는 컨텍스트가
# 10개 안팎만 돼도 PostgreSQL 기본 max_connections(100)를 넘어 마지막 테스트 클래스가 연결을 못 얻는다.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0

# HS256 키는 32바이트 이상이어야 한다.
jwt.secret=test-only-jwt-secret-key-0123456789-abcdefghijklmnop
admin.api-key=test-only-admin-api-key
app.frontend-url=http://localhost:3000

logging.file.name=target/test-app.log
logging.level.com.flatmap.navigation=INFO

# 보행난이도 DEM: 테스트는 실제 DEM 파일에 의존하지 않는다(없는 경로 → 적재 엔드포인트는 409).
walk.dem.path=target/no-such-dem.tif
