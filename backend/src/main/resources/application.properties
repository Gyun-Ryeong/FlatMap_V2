# ============================================================
# 이 파일에는 비밀값을 넣지 않는다 (CLAUDE.md 규칙 2).
# 값은 환경변수 또는 저장소 루트의 .env (gitignore 대상)에서 읽는다.
# 로컬 전용 오버라이드는 application-local.properties (gitignore 대상) 에 둔다.
# 필요한 키 이름은 저장소 루트의 .env.example 참고.
# ============================================================

# .env 를 properties 로 읽는다. backend/ 에서 실행하면 ../.env, 저장소 루트에서 실행하면 ./.env
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

server.port=8080

# ---- Database ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 스키마는 Flyway 가 관리한다. Hibernate 는 검증만 한다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- 오류 응답에 내부 정보를 싣지 않는다 ----
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ---- Kakao ----
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.oauth.client-secret=${KAKAO_OAUTH_CLIENT_SECRET:}
kakao.oauth.redirect-uri=${KAKAO_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}

# ---- JWT / Auth ----
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=604800000
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# 관리용 엔드포인트용 고정 API 키. 비어 있으면 관리용 엔드포인트는 전부 거부된다(fail closed).
admin.api-key=${ADMIN_API_KEY:}

# ---- 외부 API 키 (없어도 기동은 되며, 해당 수집/조회 호출 시점에 실패한다) ----
tmap.app-key=${TMAP_APP_KEY:}
weather.api-key=${WEATHER_API_KEY:}
public-data.api-key=${PUBLIC_DATA_API_KEY:}
gyeonggi.api-key=${GYEONGGI_API_KEY:}
gyeonggi.security-light.api-key=${GYEONGGI_SECURITY_LIGHT_API_KEY:}
gyeonggi.accident-icy.api-key=${GYEONGGI_ACCIDENT_ICY_API_KEY:}
gyeonggi.accident-normal.api-key=${GYEONGGI_ACCIDENT_NORMAL_API_KEY:}
gyeonggi.uphill-lane.api-key=${GYEONGGI_UPHILL_LANE_API_KEY:}
gyeonggi.senior-welfare.api-key=${GYEONGGI_SENIOR_WELFARE_API_KEY:}
gyeonggi.senior-center.api-key=${GYEONGGI_SENIOR_CENTER_API_KEY:}
disaster.steep-slope.api-key=${DISASTER_STEEP_SLOPE_API_KEY:}
disaster.traffic-downhill.api-key=${DISASTER_TRAFFIC_DOWNHILL_API_KEY:}
disaster.steep-slope-final.api-key=${DISASTER_STEEP_SLOPE_FINAL_API_KEY:}

# ---- 행정구역 코드 ----
region.seongnam=41130
region.sujeong=41131
region.jungwon=41133
region.bundang=41135

# ---- Logging ----
logging.file.name=logs/app.log
logging.level.root=INFO
logging.level.com.flatmap.navigation=DEBUG
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# ---- 점수 모델 (03 단계) ----
# 아래 값은 검증되지 않은 "설계 파라미터"다. 과학적 위험도·안전도가 아니다(DECISIONS.md §3).
# 같은 이름의 환경변수(예: SCORE_ROUTE_RADIUS_METERS)로도 덮어쓸 수 있다.
# 모델 버전. 공식·가중치를 바꾸면 올려서 facility_density_grid.score_version 으로 과거 값과 구분한다.
score.version=1
# 시설 가중치: 가중 시설 수 = CCTV*cctv + 보안등*security-light + 경찰시설*police.
# SafetyRoad 는 경찰을 5배 가중했으나 격자 집계가 경찰을 한 번 더 세어 실제로는 6배였다.
# 여기서는 의도한 값 5 를 명시하고 한 번만 센다.
score.weight.cctv=1
score.weight.security-light=1
score.weight.police=5
# A축(야간 시설 노출): 경로 LINESTRING 에서 이 거리(m) 이내의 CCTV·보안등, police-radius-meters 이내의 경찰시설을 센다.
score.route.radius-meters=50
score.route.police-radius-meters=300
# 경로가 이보다 짧으면 이 길이(km)로 나눠 아주 짧은 경로의 점수가 폭주하지 않게 한다.
score.route.min-length-km=0.1
# 구간 함수: "가중 시설 수/km:점수" 쌍(오름차순). 사이는 선형 보간, 양 끝 밖은 끝 값으로 고정한다.
score.route.exposure-breakpoints=0:0,2:20,5:40,10:60,20:80,40:100
# 총점 = 축 점수의 가중 평균(반영된 축만). 지금은 A축만 있다. B축(보행난이도)·C축(날씨)은 이후 단계에서 추가한다.
score.route.axis-weight.a=1.0

# ---- 시설 밀도 격자 (03 단계) ----
# 성남 범위(SeongnamFilter 와 같은 값)와 격자 크기(경도 0.0034° x 위도 0.0027°, 위도 37.4° 에서 약 300m x 300m).
score.grid.min-lat=37.33
score.grid.max-lat=37.53
score.grid.min-lng=127.04
score.grid.max-lng=127.20
score.grid.cell-lat=0.0027
score.grid.cell-lng=0.0034
# 구간 함수: "가중 시설 수:점수" (SafetyRoad 의 시설 수→점수 공식과 같은 값).
score.grid.score-breakpoints=0:10,1:30,2:40,5:61,10:81,22.67:100
# 등급 경계: 점수 <= low-density-max-score 면 LOW_DENSITY, <= medium-max-score 면 MEDIUM, 그보다 크면 HIGH_DENSITY.
# 시설이 적다는 것은 위험하다는 뜻이 아니라 시설 데이터가 적다는 뜻이다.
score.grid.low-density-max-score=30
score.grid.medium-max-score=60

# ---- T Map 보행자 경로 호출 타임아웃 (ms) ----
tmap.connect-timeout-ms=2000
tmap.read-timeout-ms=5000
