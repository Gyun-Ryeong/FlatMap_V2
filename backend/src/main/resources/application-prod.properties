# ============================================================
# 운영 프로필(SPRING_PROFILES_ACTIVE=prod). 이 파일에도 비밀값을 넣지 않는다.
# Docker 이미지와 docker-compose.prod.yml 이 이 프로필을 켠다.
# ============================================================

# 개발용 기본값을 쓰지 않는다: 값이 없으면 기동이 실패한다(빈 값은 ProdSettingsValidator 가 막는다).
app.frontend-url=${FRONTEND_URL}
kakao.oauth.redirect-uri=${KAKAO_OAUTH_REDIRECT_URI}

# 로그인 쿠키에 Secure 속성을 붙인다(HTTPS 에서만 전송). HTTP 로만 접근하는 내부 시험 환경에서만 COOKIE_SECURE=false.
app.cookie-secure=${COOKIE_SECURE:true}

# 리버스 프록시(nginx 등) 뒤에서 X-Forwarded-* 헤더를 따른다.
server.forward-headers-strategy=framework

# 컨테이너는 표준 출력으로만 로그를 남긴다(파일 로그 끔). 앱 로그 수준은 INFO.
logging.file.name=
logging.level.com.flatmap.navigation=INFO
