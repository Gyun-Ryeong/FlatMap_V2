# 운영용 전체 스택: PostGIS DB + 백엔드 + 프론트(nginx). 특정 클라우드에 종속되지 않는다.
#
#   cp .env.example .env          # 값을 채운다(.env 는 서버에만 두고 커밋하지 않는다)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 개발용은 docker-compose.yml(DB 만, 또는 --profile stack)이다. 이 파일은 운영 기본값만 담는다:
#  - DB 포트를 호스트에 열지 않는다(내부 네트워크 안에서만 접근).
#  - 백엔드는 호스트의 127.0.0.1 에만 열린다(서버 안에서 관리용 호출용). 공개 진입점은 프론트(nginx) 하나다.
#  - 필수 환경변수가 없으면 시작하지 않는다(VAR:? 문법).
#  - 비밀값은 이 파일이 아니라 .env 에서 온다. 이 파일에는 값이 없다.
#
# 자세한 절차: docs/DEPLOY.md, 환경변수: docs/ENVIRONMENT.md
name: ${COMPOSE_PROJECT_NAME:-flatmap}

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME 이 필요합니다 (.env 확인)}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME 이 필요합니다 (.env 확인)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 필요합니다 (.env 확인)}
    volumes:
      - flatmap_pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  backend:
    build:
      context: ./backend
    image: ${IMAGE_PREFIX:-flatmap}-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 아래 값은 .env 보다 우선한다(.env 의 DB_URL 은 호스트에서 접속할 때의 주소라 컨테이너에서는 쓰지 않는다).
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL(사이트 공개 주소)이 필요합니다}
      KAKAO_OAUTH_REDIRECT_URI: ${KAKAO_OAUTH_REDIRECT_URI:?KAKAO_OAUTH_REDIRECT_URI 가 필요합니다}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 이 필요합니다}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY 가 필요합니다}
      # .env 가 빈 값이면 Spring 이 그 빈 값을 쓰므로 기본값을 여기서 채운다.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # 호스트 경로가 .env 에 있어도 컨테이너 안에서는 마운트한 /data 아래를 본다.
      WALK_DEM_PATH: /data/dem/Copernicus_DSM_COG_10_N37_00_E127_00_DEM.tif
      SEONGNAM_SECURITY_LIGHT_CSV_PATH: /data/seongnam_security_light.csv
    volumes:
      # DEM·보안등 CSV 는 이미지에 넣지 않고 호스트 디렉터리를 읽기 전용으로 마운트한다.
      - ${DATA_DIR:-./data}:/data:ro
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  frontend:
    build:
      context: ./frontend
      args:
        # 브라우저 번들에 들어가는 공개 값만 넘긴다(서버 비밀값 금지).
        VITE_KAKAO_API_KEY: ${VITE_KAKAO_API_KEY:?VITE_KAKAO_API_KEY(카카오 JS 키)가 필요합니다}
        VITE_API_BASE_URL: ""
        VITE_BACKEND_URL: ""
    image: ${IMAGE_PREFIX:-flatmap}-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${HTTP_PORT:-80}:8080"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  internal:

volumes:
  flatmap_pgdata:
