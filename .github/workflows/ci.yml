name: CI

# 모든 브랜치 push 와 모든 PR 에서 돌린다. 비밀값은 쓰지 않는다 — 아래 DB 계정은 CI 안에서만 쓰는 가짜 값이다.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # 백엔드 테스트는 PostGIS 가 켜진 실제 DB 에 붙는다. 테스트 컨텍스트마다 Flyway clean → migrate 하므로
      # DB 이름은 반드시 _test 로 끝나야 한다(TestFlywayConfig 가 확인한다).
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: flatmapv2_test
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d flatmapv2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/flatmapv2_test
      TEST_DB_USERNAME: ci_user
      TEST_DB_PASSWORD: ci_only_password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test
        run: ./mvnw -B -ntp verify

  frontend:
    name: frontend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test (Vitest)
        run: npm test
      - name: Build (Vite)
        run: npm run build

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked files for secrets and large files
        run: bash scripts/check-repo-hygiene.sh
